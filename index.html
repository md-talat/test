<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <!-- google font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Handlee&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <div class="left-container">
                <div class="left-container-img-section">
                    <img src="./photos/profile_pic.jpeg" alt="">
                </div>
                <div class="left-container-items">
                    <ul>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Experience</a></li>
                        <li><a href="#">Work</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
                </div>
            </div>
            <div class="right-container">
                <div class="right-container-upper-section">
                    <h1>Profile</h1>
                    <div class="right-container-upper-section-items">
                        <ul>
                            <li><a href="#">Facebook</a></li>
                            <li><a href="#">Instagram</a></li>
                            <li><a href="#">WhatsApp</a></li>
                            <li><a href="#">Email</a></li>
                        </ul>
                    </div>
                    <div class="right-container-upper-section-images">
                        <div class="right-container-upper-section-images-container">
                            <img src="./photos/img1.jpg" alt="">
                        </div>
                        <div class="right-container-upper-section-images-container">
                            <img src="./photos/img2.avif" alt="">
                        </div>
                    </div>
                </div>
                <div class="right-container-contact-section">
                    <h1>Contact</h1>
                    <div class="right-container-contact-info-section">
                        <form>
                            <div class="form-itmes">
                                <label for="name">Fullname</label>
                                <input type="text" placeholder="Enter Your Fullname">
                            </div>
                            <div class="form-itmes">
                                <label for="email">Email</label>
                                <input type="email" placeholder="Enter Your Email Address">
                            </div>
                            <div class="form-itmes">
                                <label for="number">Phone Number</label>
                                <input type="text" placeholder="Enter Your Phone Number">
                            </div>
                            <div class="form-itmes">
                                <label for="address">Address</label>
                                <textarea rows="4" cols="30" placeholder="Enter Your Address"></textarea>
                            </div>
                        </form> 
                    </div>
                </div> 
            </div>
        </div>
    </header>
</body>
</html>
